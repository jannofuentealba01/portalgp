# Endurecimiento portable. La lista de IP permitidas se administra en el
# firewall del proveedor y no se codifica aquí.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
MaxAuthTries 4
