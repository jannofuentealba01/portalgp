# Formato exclusivo de diagnóstico para PortalGP. Se registra la ruta normalizada
# sin query string para no conservar identificadores, referencias ni tokens.
log_format portalgp_timing escape=json '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,"upstream_connect_time":"$upstream_connect_time","upstream_header_time":"$upstream_header_time","upstream_response_time":"$upstream_response_time"}';
