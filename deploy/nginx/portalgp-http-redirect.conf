# Se instala únicamente después de comprobar que el certificado y el servidor
# HTTPS funcionan. Mantiene disponible el desafío automático de renovación.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
    server_tokens off;
    try_files $uri =404;
}

location = /portalgp {
    server_tokens off;
    if ($host != "15.229.113.179") { return 421; }
    if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }
    return 308 https://$host/portalgp/;
}

location /portalgp/ {
    server_tokens off;
    if ($host != "15.229.113.179") { return 421; }
    if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }

    location ~* ^/portalgp/(?:tests|scripts|config|del|deploy)(?:/|$) {
        deny all;
    }

    location ~* ^/portalgp/(?:\.git|\.github|\.claude|\.codex|\.env)(?:/|$) {
        deny all;
    }

    location ~* ^/portalgp/.*(?:^|\.)(?:bak|backup|old|orig|save|sql|md|log|ini|env|lock|toml|ya?ml|dist|pem|key|pfx|p12|db|sqlite|zip|7z|xlsx?|csv|docx?|json)$ {
        deny all;
    }

    location ~ ^/portalgp/.*\.php$ {
        if ($host != "15.229.113.179") { return 421; }
        if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }
        return 308 https://$host$request_uri;
    }

    return 308 https://$host$request_uri;
}
