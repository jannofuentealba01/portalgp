# Fase previa a HTTPS. Este archivo se incluye dentro del servidor HTTP actual.
# Después de emitir el certificado, deploy_portalgp_security.sh lo reemplaza por
# portalgp-http-redirect.conf.
include /etc/nginx/snippets/portalgp-app.conf;

# Certbot valida la IP en la raíz del host, no bajo /portalgp.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
    server_tokens off;
    try_files $uri =404;
}
