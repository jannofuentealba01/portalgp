location = /portalgp {
    return 302 /portalgp/;
}

# Apache aplica esta protección desde .htaccess; Nginx necesita la regla explícita.
location ~* ^/portalgp/.*(?:mockup|prototype).*\.html?$ {
    deny all;
}

location /portalgp/ {
    root /var/www;
    index index.php;
    # Permite el PDF contractual de 15 MB más el pequeño overhead multipart.
    client_max_body_size 16M;
    try_files $uri $uri/ /portalgp/index.php?$query_string;
}

location ~ ^/portalgp/(.+\.php)$ {
    root /var/www;
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_param PHP_VALUE "include_path=.:/var/www/portalgp:/usr/share/php\nupload_max_filesize=15M\npost_max_size=16M";
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_hide_header X-Powered-By;
}
