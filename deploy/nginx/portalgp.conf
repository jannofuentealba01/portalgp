location = /portalgp {
    return 302 /portalgp/;
}

# Apache aplica esta protección desde .htaccess; Nginx necesita la regla explícita.
location ~* ^/portalgp/.*(?:mockup|prototype).*\.html?$ {
    deny all;
}

location /portalgp/ {
    root /var/www;
    index index.php;
    try_files $uri $uri/ /portalgp/index.php?$query_string;
}

location ~ ^/portalgp/(.+\.php)$ {
    root /var/www;
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_param PHP_VALUE include_path=.:/var/www/portalgp:/usr/share/php;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_hide_header X-Powered-By;
}
