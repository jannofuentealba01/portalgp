# Rutas operativas de PortalGP. Es reutilizable en HTTP durante la emisión del
# certificado y dentro del servidor HTTPS después de habilitar TLS.
location = /portalgp {
    server_tokens off;
    return 302 /portalgp/;
}

location /portalgp/ {
    root /var/www;
    index index.php;
    server_tokens off;
    client_max_body_size 16M;
    access_log /var/log/nginx/portalgp_timing.log portalgp_timing;
    add_header X-Request-ID $request_id always;

    # Nginx no interpreta .htaccess. Estas reglas reproducen y amplían las
    # protecciones del repositorio sin cambiar el sitio it-conecta.
    location ~* ^/portalgp/(?:tests|scripts|config|del|deploy)(?:/|$) {
        deny all;
    }

    location ~* ^/portalgp/(?:\.git|\.github|\.claude|\.codex|\.env)(?:/|$) {
        deny all;
    }

    location ~* ^/portalgp/.*(?:^|\.)(?:bak|backup|old|orig|save|sql|md|log|ini|env|lock|toml|ya?ml|dist|pem|key|pfx|p12|db|sqlite|zip|7z|xlsx?|csv|docx?|json)$ {
        deny all;
    }

    location ~* ^/portalgp/(?:composer\.(?:json|lock)|package(?:-lock)?\.json|phpunit\.xml(?:\.dist)?|semgrep-msp\.json|PORTALGP\.bak)$ {
        deny all;
    }

    location ~* ^/portalgp/.*(?:mockup|prototype).*\.html?$ {
        deny all;
    }

    location ~* ^/portalgp/(?:crear_usuario|editar_usuario|eliminar_usuario|desactivar_usuario|gestion_usuarios_permisos|crear_permiso|listar_permisos|editar_eliminar_permisos|asignar_permisos_roles|procesar_asignar_permisos|procesar_crear_usuario|procesar_editar_usuario|procesar_eliminar_usuario)\.php$ {
        deny all;
    }

    location ~ ^/portalgp/(.+\.php)$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "include_path=.:/var/www/portalgp:/usr/share/php\nupload_max_filesize=15M\npost_max_size=16M";
        fastcgi_pass unix:/run/php/php8.3-fpm-portalgp.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    try_files $uri $uri/ /portalgp/index.php?$query_string;
}
