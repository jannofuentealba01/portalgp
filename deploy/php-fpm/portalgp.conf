[portalgp]
user = portalgp
group = portalgp

listen = /run/php/php8.3-fpm-portalgp.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 400

; Diagnóstico y corte defensivo exclusivos del pool PortalGP. El histórico
; medido tuvo un máximo de 12,388 s, por lo que 120 s conserva amplio margen.
request_slowlog_timeout = 3s
request_terminate_timeout = 120s
slowlog = /var/log/php8.3-fpm-portalgp-slow.log

clear_env = yes
security.limit_extensions = .php
catch_workers_output = yes

; Origen único para redirecciones y enlaces absolutos. Debe cambiarse al
; dominio definitivo cuando PortalGP migre desde la IP temporal.
env[PORTALGP_CANONICAL_BASE_URL] = "http://15.229.113.179"

; PortalGP no comparte sesiones con aplicaciones alojadas en el pool www.
php_value[session.save_handler] = files
php_value[session.save_path] = /var/lib/php/sessions-portalgp
